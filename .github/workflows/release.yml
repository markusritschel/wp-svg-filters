# On a version tag (v1.2.3): zip the module wrapped in svg-filters/ and
# attach it to the GitHub release (created if it doesn't exist yet).
# Files marked export-ignore in .gitattributes stay out of the zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches SVGF_VERSION
        run: |
          version=$(sed -n "s/.*define( 'SVGF_VERSION', '\([^']*\)' );.*/\1/p" svg-filters.php)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match SVGF_VERSION $version in svg-filters.php"
            exit 1
          fi

      - name: Build zip
        run: git archive --format=zip --prefix=svg-filters/ -o "svg-filters-$GITHUB_REF_NAME.zip" "$GITHUB_REF_NAME"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "svg-filters-$GITHUB_REF_NAME.zip" --clobber
