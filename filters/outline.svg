<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="fx-outline" x="-10%" y="-10%" width="120%" height="120%"
          data-category="shape" data-support="all" data-cost="low" data-demo="type" data-demo-text="Hollow" data-note="Works on text, icons and any shape.">
    <title>Outline only</title>
    <desc>Dilates the alpha, subtracts the original and fills the remaining ring with a flood color.</desc>
    <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="thick" data-tweak-radius="[1, 12 px] Outline width"/>
    <feComposite in="thick" in2="SourceAlpha" operator="out" result="ring"/>
    <feFlood flood-color="#3a40d1" result="ink" data-tweak-flood-color="Outline color"/>
    <feComposite in="ink" in2="ring" operator="in"/>
  </filter>
</svg>
