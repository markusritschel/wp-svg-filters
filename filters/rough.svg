<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="fx-rough" x="-10%" y="-10%" width="120%" height="120%"
          data-category="distortion" data-support="all" data-cost="low" data-demo="type" data-demo-text="Sketch" data-note="Best on text and icons.">
    <title>Rough edges</title>
    <desc>Small, busy displacement gives type and icons a hand-cut, ink-bleed edge.</desc>
    <feTurbulence type="turbulence" baseFrequency=".045" numOctaves="2" seed="2" result="jitter" data-tweak-baseFrequency="[0.005, 0.2] Jitter frequency | Higher is busier"/>
    <feDisplacementMap in="SourceGraphic" in2="jitter" scale="7" xChannelSelector="R" yChannelSelector="G" data-tweak-scale="[0, 30 px] Edge roughness"/>
    <feConvolveMatrix order="3" kernelMatrix="0 1 0 1 4 1 0 1 0" divisor="8" preserveAlpha="false" edgeMode="none"/>
  </filter>
</svg>
