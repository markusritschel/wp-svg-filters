<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="fx-posterize" color-interpolation-filters="sRGB"
          data-category="color" data-support="all" data-cost="low" data-demo="scene">
    <title>Posterize</title>
    <desc>Discrete steps per channel flatten gradients into screen-print bands.</desc>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0 .35 .7 1" data-tweak-tableValues="Red output levels, 0–1; more values give more bands"/>
      <feFuncG type="discrete" tableValues="0 .35 .7 1" data-tweak-tableValues="Green output levels, 0–1"/>
      <feFuncB type="discrete" tableValues="0 .35 .7 1" data-tweak-tableValues="Blue output levels, 0–1"/>
    </feComponentTransfer>
  </filter>
</svg>
