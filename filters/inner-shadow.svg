<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="fx-inner-shadow"
          data-category="light" data-support="all" data-cost="low" data-demo="type" data-demo-text="Inset" data-note="Text and icons.">
    <title>Inner shadow</title>
    <desc>Inverts the alpha, blurs and offsets it and clips it to the shape, which CSS `box-shadow: inset` cannot do on text.</desc>
    <feComponentTransfer in="SourceAlpha" result="inverse">
      <feFuncA type="table" tableValues="1 0"/>
    </feComponentTransfer>
    <feGaussianBlur in="inverse" stdDeviation="4"/>
    <feOffset dx="4" dy="6" result="offsetBlur"/>
    <feFlood flood-color="#000000" flood-opacity=".65"/>
    <feComposite in2="offsetBlur" operator="in"/>
    <feComposite in2="SourceAlpha" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="SourceGraphic"/>
      <feMergeNode in="shadow"/>
    </feMerge>
  </filter>
</svg>
