<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="fx-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"
          data-category="texture" data-support="all" data-cost="medium" data-demo="scene">
    <title>Film grain</title>
    <desc>Blends high-frequency mono noise with `overlay` and mixes it back at about half strength.</desc>
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch" result="noise" data-tweak-baseFrequency="[0.2, 2] Grain fineness | Higher gives finer grain"/>
    <feColorMatrix in="noise" type="matrix" values=".33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 0 1" result="mono"/>
    <feComponentTransfer in="mono" result="veil">
      <feFuncA type="linear" slope=".55" intercept="0" data-tweak-slope="[0, 1] Grain strength | 0 shows no grain, 1 the full overlay"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="veil" mode="overlay" result="mix"/>
    <feComposite in="mix" in2="SourceAlpha" operator="in"/>
  </filter>
</svg>
