<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="fx-wave-anim">
    <feTurbulence type="fractalNoise" baseFrequency=".01 .04" numOctaves="2" seed="5" result="map">
      <animate attributeName="baseFrequency" dur="9s" values=".01 .04; .016 .07; .01 .04" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="22" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
