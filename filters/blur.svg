<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Soft blur: edges fade out. For elements, text, icons, shapes. -->
  <filter id="fx-blur" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
  </filter>

  <!-- Solid-edge blur: edges stay crisp and opaque. For rectangular images and
       backgrounds (pair it with the background-only class variant). Makes transparent areas opaque,
       so don't use it on text or cut-out shapes. -->
  <filter id="fx-blur-solid" x="0" y="0" width="100%" height="100%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="8" edgeMode="duplicate"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="1 1"/>
    </feComponentTransfer>
  </filter>
</svg>
