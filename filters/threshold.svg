<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="fx-threshold" color-interpolation-filters="sRGB"
          data-category="color" data-support="all" data-cost="low" data-demo="scene">
    <title>Threshold</title>
    <desc>Cuts luminance into two ink tones for stencil and photocopy looks.</desc>
    <feColorMatrix type="matrix" values=".3 .59 .11 0 0  .3 .59 .11 0 0  .3 .59 .11 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0.08 0.96"/>
      <feFuncG type="discrete" tableValues="0.09 0.94"/>
      <feFuncB type="discrete" tableValues="0.16 0.90"/>
    </feComponentTransfer>
  </filter>
</svg>
